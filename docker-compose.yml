services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: plateful
      POSTGRES_USER: plateful
      POSTGRES_PASSWORD: plateful
    ports:
      - "5432:5432"
    volumes:
      - plateful_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plateful"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  plateful_postgres:

